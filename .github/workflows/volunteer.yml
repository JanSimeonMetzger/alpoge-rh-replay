name: Volunteer packet replay
run-name: Replay ${{ inputs.packet }} for claim ${{ inputs.claim }}
on:
  workflow_dispatch:
    inputs:
      packet:
        description: Granted packet ID
        required: true
        type: string
      claim:
        description: Upstream issue number
        required: true
        type: string
      revision:
        description: Reviewed upstream tracker commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: volunteer-packet-${{ inputs.packet }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PACKET: ${{ inputs.packet }}
      CLAIM: ${{ inputs.claim }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Confirm volunteer grant
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKET" =~ ^P[0-9]{4}$ && "$CLAIM" =~ ^[0-9]+$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          api="repos/rohanarun/alpoge-rh-replay/issues/$CLAIM"
          gh api "$api" | jq -e --arg title "Claim $PACKET" '.state == "open" and .title == $title and .user.login == "JanSimeonMetzger" and any(.labels[]; .name == "claim-granted")'
          gh api --paginate --slurp "$api/comments?per_page=100" | jq 'add' | jq -e --arg prefix "Granted \`$PACKET\`." 'any(.[]; .user.login == "github-actions[bot]" and (.body | startswith($prefix)))'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rohanarun/alpoge-rh-replay
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Install elan and prepare original sources
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Preparation started at $(date -u +%FT%TZ)"
            echo "Runner $RUNNER_OS $RUNNER_ARCH"
            echo "Logical processors $(nproc)"
            awk '/^MemTotal:/ { print "Total memory", $2, $3 }' /proc/meminfo
            df -h .
          } | tee "$RUNNER_TEMP/resources.txt"
          mkdir -p "$RUNNER_TEMP/launcher"
          base=https://github.com/leanprover/elan/releases/download/v4.4.0
          curl -fsSL --retry 3 "$base/elan-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP/launcher"
          ELAN_HOME="$RUNNER_TEMP/launcher/home" "$RUNNER_TEMP/launcher/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$RUNNER_TEMP/launcher/home/bin:$PATH"
          echo "$RUNNER_TEMP/launcher/home/bin" >> "$GITHUB_PATH"
          bash ./verify.sh "$RUNNER_TEMP/replay" --prepare-only
      - name: Build all modules and record evidence
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          echo "Packet build started at $(date -u +%FT%TZ)" >> "$RUNNER_TEMP/resources.txt"
          status=0
          python3 tracker/tasks.py build "$PACKET" "$RUNNER_TEMP/replay/lean" "$RUNNER_TEMP/receipt" --bundle > "$RUNNER_TEMP/packet-driver.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/packet-driver.log"
          echo "Packet build ended at $(date -u +%FT%TZ) with status $status" >> "$RUNNER_TEMP/resources.txt"
          df -h . >> "$RUNNER_TEMP/resources.txt"
          if [[ -d "$RUNNER_TEMP/receipt" ]]; then
            cp "$RUNNER_TEMP/resources.txt" "$RUNNER_TEMP/receipt/resources.txt"
            echo "$(( $(date +%s) - start ))" > "$RUNNER_TEMP/receipt/elapsed-seconds.txt"
          fi
          exit "$status"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ inputs.packet }}
          path: |
            ${{ runner.temp }}/receipt/
            ${{ runner.temp }}/replay/replay.log
            ${{ runner.temp }}/packet-driver.log
            ${{ runner.temp }}/resources.txt
          retention-days: 2
          if-no-files-found: warn
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PACKET: ${{ inputs.packet }}
      CLAIM: ${{ inputs.claim }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: volunteer
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rohanarun/alpoge-rh-replay
          ref: ${{ inputs.revision }}
          path: source
          sparse-checkout: tracker
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: evidence-${{ inputs.packet }}
          path: evidence
      - name: Verify each reserved target against the receipt
        run: python3 -I volunteer/verify_packet.py source "$PACKET" evidence/receipt
      - name: Publish reviewed evidence to this fork
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKET" =~ ^P[0-9]{4}$ && "$CLAIM" =~ ^[0-9]+$ ]]
          tag="replay-$PACKET-issue-$CLAIM"
          cd evidence/receipt
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Independent Lean replay by Jan Metzger for [%s](https://github.com/rohanarun/alpoge-rh-replay/issues/%s).\n' "$PACKET" "$CLAIM" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "$PACKET — independent Lean replay" --notes-file "$RUNNER_TEMP/release-notes.md" receipt.json build.log targets.tar.gz resources.txt elapsed-seconds.txt
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          for file in receipt.json build.log targets.tar.gz resources.txt elapsed-seconds.txt; do
            sum=$(sha256sum "$file" | cut -d' ' -f1)
            jq -e --arg file "$file" --arg sum "sha256:$sum" 'any(.assets[]; .name == $file and .state == "uploaded" and .digest == $sum)' "$RUNNER_TEMP/release.json" >/dev/null
          done
